databases:
  - name: printify-db
    databaseName: printifydb
    user: printify
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: printify
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ConnectionStrings__Default
        fromDatabase:
          name: printify-db
          property: connectionString
